<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Checkout — The Secret of Masonic Prosperity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>

<style>
:root{
  --navy:#0a1b3d; --gold:#c9a227; --cream:#fdf6e3; --card:#fff;
  --ink:#1c2434; --ink-soft:#6b7280; --line:#e4e2dc; --r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
img{max-width:100%;height:auto;display:block}
body{background:var(--cream);font-family:'Karla',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}

.topbar{background:var(--gold);color:var(--navy);text-align:center;padding:12px 16px;font-size:14px;font-weight:600}

.banner{max-width:900px;margin:0 auto;padding:16px 16px 0}
.banner--bottom{padding:32px 16px}
.banner img{width:100%;border-radius:var(--r)}
.ph{width:100%;border:2px dashed var(--gold);border-radius:var(--r);background:rgba(201,162,39,.07);
    display:grid;place-items:center;color:#8a7320;font-size:13px;font-weight:600;text-align:center;padding:16px}
.ph--banner{aspect-ratio:1200/260}
.ph--bottom{aspect-ratio:900/1200}
@media(max-width:640px){.ph--banner{aspect-ratio:800/420}}

.wrap{max-width:900px;margin:0 auto;padding:16px}

.product{display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;border-bottom:0;padding:16px}
.product__thumb{width:56px;height:56px;flex:0 0 56px;border-radius:8px;overflow:hidden;
  border:2px dashed var(--gold);background:rgba(201,162,39,.07);
  display:grid;place-items:center;font-size:9px;font-weight:700;color:#8a7320;text-align:center;line-height:1.1}
.product__thumb img{width:100%;height:100%;object-fit:cover}
.product__info{flex:1;min-width:0}
.product__name{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:700;line-height:1.2}
.product__price{color:var(--ink-soft);font-size:15px;margin-top:2px}

.checkout-box{background:var(--card);border:1px solid var(--line);
  border-radius:0 0 var(--r) var(--r);padding:16px;min-height:420px}
@media(max-width:640px){.checkout-box{padding:12px}}

.loading{display:grid;place-items:center;min-height:380px;gap:12px;color:var(--ink-soft);font-size:14px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.alert{display:none;margin:16px;background:#fdecea;border:1px solid #f5c6c2;border-radius:8px;
       padding:14px 16px;color:#b3261e;font-size:14px;line-height:1.5}
.alert.show{display:block}

.legal{max-width:520px;margin:20px auto 0;text-align:center;font-size:13px;line-height:1.6;color:var(--ink-soft)}
.legal a{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>

<!-- ===== BANNER TOPO =====
     Substitua a div .ph por:
     <picture>
       <source media="(max-width:640px)" srcset="/img/banner-mobile.webp">
       <img src="/img/banner-desktop.webp" alt="The Secret of Masonic Prosperity">
     </picture>
     Desktop 1200x260 · Mobile 800x420 -->
<div class="banner">
  <div class="ph ph--banner">BANNER TOPO<br>desktop 1200&times;260 &nbsp;·&nbsp; mobile 800&times;420</div>
</div>

<div class="wrap">
  <div class="product">
    <!-- Substitua por: <img src="/img/product-thumb.webp" alt="..."> — 112x112 -->
    <div class="product__thumb">IMG<br>112&times;112</div>
    <div class="product__info">
      <div class="product__name" id="p-name"></div>
      <div class="product__price" id="p-price"></div>
    </div>
  </div>

  <div class="checkout-box">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>Loading secure checkout…</span>
    </div>
    <div id="checkout"></div>
  </div>

  <div class="alert" id="alert" role="alert"></div>

  <p class="legal">
    By completing this purchase you agree to our
    <a href="/terms">Terms of Use</a> and <a href="/privacy">Privacy Policy</a>.<br>
    <span id="refund"></span>
  </p>
</div>

<div class="banner banner--bottom">
  <div class="ph ph--bottom">BANNER RODAPÉ<br>900&times;1200 (vertical)</div>
</div>

<script>
/* =====================================================================
   CONFIG — o único bloco que você edita.
   A chave publicável (pk_) PODE ficar aqui: ela é pública por design.
   A chave SECRETA (sk_) nunca entra aqui — ela mora só no Supabase.
   ===================================================================== */
const CONFIG = {
  // Troque pela sua chave publicável de TESTE (pk_test_...)
  publishableKey: 'pk_test_TROQUE_AQUI',

  // URL da função no Supabase (troque SEU_PROJECT_REF pelo ref do projeto)
  sessionUrl: 'https://SEU_PROJECT_REF.supabase.co/functions/v1/create-checkout-session',

  offer: 'masonic_prosperity',

  productName: 'The Secret of Masonic Prosperity',
  priceLabel : '$37.00 — one-time payment',

  topbar    : 'Instant digital delivery — access sent to your email',
  refundNote: '30-day refund policy.'
};

document.getElementById('topbar').textContent  = CONFIG.topbar;
document.getElementById('p-name').textContent  = CONFIG.productName;
document.getElementById('p-price').textContent = CONFIG.priceLabel;
document.getElementById('refund').textContent  = CONFIG.refundNote;

const $alert = document.getElementById('alert');
function fail(msg){
  document.getElementById('loading').style.display = 'none';
  $alert.textContent = msg;
  $alert.classList.add('show');
}

const q = new URLSearchParams(location.search);
const pick = k => q.get(k) || undefined;

const stripe = Stripe(CONFIG.publishableKey);

async function fetchClientSecret(){
  const res = await fetch(CONFIG.sessionUrl, {
    method : 'POST',
    headers: { 'Content-Type':'application/json' },
    body   : JSON.stringify({
      offer       : CONFIG.offer,
      utm_source  : pick('utm_source'),
      utm_medium  : pick('utm_medium'),
      utm_campaign: pick('utm_campaign'),
      utm_content : pick('utm_content'),
      utm_term    : pick('utm_term'),
      fbclid      : pick('fbclid'),
      click_id    : pick('cid') || pick('click_id')
    })
  });
  const data = await res.json();
  if (!res.ok || !data.clientSecret) throw new Error(data.error || 'no_client_secret');
  return data.clientSecret;
}

(async () => {
  try {
    const checkout = await stripe.initEmbeddedCheckout({ fetchClientSecret });
    checkout.mount('#checkout');
    document.getElementById('loading').style.display = 'none';
    if (window.fbq) fbq('track', 'InitiateCheckout');
  } catch (err) {
    console.error(err);
    fail('We could not load the checkout. Please refresh the page or try again in a moment.');
  }
})();
</script>
</body>
</html>
