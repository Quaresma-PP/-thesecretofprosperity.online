<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you — The Secret of Masonic Prosperity</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1b3d;color:#f5f1e8;font-family:'Karla',system-ui,sans-serif;
     display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center}
.box{max-width:520px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:36px;color:#c9a227;margin-bottom:16px;line-height:1.15}
p{font-size:17px;line-height:1.65;opacity:.92;margin-bottom:14px}
.mail{color:#c9a227;font-weight:600;word-break:break-all}
.small{font-size:14px;opacity:.7;margin-top:24px}
a{color:#c9a227}
.spinner{width:30px;height:30px;margin:0 auto 20px;border:3px solid rgba(245,241,232,.2);
         border-top-color:#c9a227;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="root">
  <div class="spinner"></div>
  <p>Confirming your payment…</p>
</div>

<script>
const CONFIG = {
  // Troque SEU_PROJECT_REF pelo ref do projeto Supabase
  statusUrl   : 'https://adaicbrfpxodasroosxx.supabase.co/functions/v1/session-status',
  checkoutUrl : '/',
  supportEmail: 'support@thesecretofprosperity.online'
};

const root = document.getElementById('root');
const sessionId = new URLSearchParams(location.search).get('session_id');
function render(html){ root.innerHTML = html; }

(async () => {
  if (!sessionId) {
    return render(`<h1>Nothing to see here</h1>
      <p>No checkout session was found. If you just paid, check your inbox.</p>`);
  }
  try {
    const res = await fetch(CONFIG.statusUrl, {
      method : 'POST',
      headers: { 'Content-Type':'application/json' },
      body   : JSON.stringify({ session_id: sessionId })
    });
    const data = await res.json();

    if (data.status === 'complete') {
      if (window.fbq) fbq('track', 'Purchase');
      return render(`
        <h1>Your access is on its way</h1>
        <p>Payment confirmed. We just sent your access link to
           <span class="mail">${data.email || 'your email'}</span>.</p>
        <p>It usually arrives within a minute. If you don't see it, check your
           spam or promotions folder.</p>
        <p class="small">Still nothing after 10 minutes?
           Write to <a href="mailto:${CONFIG.supportEmail}">${CONFIG.supportEmail}</a>.</p>`);
    }
    if (data.status === 'open') {
      return render(`<h1>Payment not completed</h1>
        <p>Your checkout is still open — nothing was charged.</p>
        <p><a href="${CONFIG.checkoutUrl}">Return to checkout</a></p>`);
    }
    render(`<h1>This session expired</h1>
      <p>No charge was made. <a href="${CONFIG.checkoutUrl}">Start again</a>.</p>`);
  } catch (e) {
    render(`<h1>We couldn't confirm right now</h1>
      <p>If your payment went through, your access is on its way regardless.</p>
      <p class="small"><a href="mailto:${CONFIG.supportEmail}">${CONFIG.supportEmail}</a></p>`);
  }
})();
</script>
</body>
</html>
